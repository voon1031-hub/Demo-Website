    <style>
      /* Boot shell: closed container doors, painted before any JavaScript runs.
         React replaces it with the identical Hero on first render. */
      html, body { margin: 0; background: #07142a; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center;
        background: linear-gradient(90deg, transparent calc(15% - 4px), rgb(7 20 42 / .8) calc(15% - 4px) calc(15% + 4px), transparent calc(15% + 4px)),
          linear-gradient(90deg, transparent calc(35% - 4px), rgb(7 20 42 / .8) calc(35% - 4px) calc(35% + 4px), transparent calc(35% + 4px)),
          linear-gradient(90deg, transparent calc(65% - 4px), rgb(7 20 42 / .8) calc(65% - 4px) calc(65% + 4px), transparent calc(65% + 4px)),
          linear-gradient(90deg, transparent calc(85% - 4px), rgb(7 20 42 / .8) calc(85% - 4px) calc(85% + 4px), transparent calc(85% + 4px)),
          repeating-linear-gradient(90deg, rgb(255 255 255 / .05) 0 2px, transparent 2px 26px, rgb(0 0 0 / .28) 26px 30px, transparent 30px 34px),
          linear-gradient(180deg, #23344a 0%, #1c2836 55%, #141f2c 100%); }
      .boot::after { content: ''; position: absolute; inset: 0 auto 0 50%; width: 3px; transform: translateX(-50%);
        background: #ff5f1f; box-shadow: 0 0 24px 6px rgb(255 95 31 / .55); }
      /* Same spot as the Hero's mark above the slogan */
      .boot svg { position: relative; z-index: 1; width: 56px; height: 56px; transform: translateY(-168px); }
      @media (min-width: 640px) { .boot svg { width: 64px; height: 64px; transform: translateY(-180px); } }
    </style>
