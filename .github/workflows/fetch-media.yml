# Downloads the generated media listed in tools/media.txt on a GitHub runner
# (the cloud dev environment can't reach the media host), compresses it, cuts the
# hero timelapse into frames, and commits assets/ back to this branch.
name: Fetch generated media
on:
  push:
    branches: [claude/inspiring-volta-dtrlw7]
    paths: ['tools/media.txt', 'tools/fetch-media.sh']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-media-${{ github.ref }}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and process media
        run: bash tools/fetch-media.sh
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets promo
          git commit -m "Add generated media" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
