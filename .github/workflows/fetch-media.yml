# One-off helper: downloads the generated Fornello media on a GitHub runner
# (the cloud dev environment can't reach the media host), compresses it,
# and commits images/ and videos/ back to this branch.
name: Fetch Fornello media
on:
  push:
    branches: [claude/fornello-pizza-site]
    paths: ['.github/workflows/fetch-media.yml', 'tools/fetch-media.sh']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and compress media
        run: bash tools/fetch-media.sh
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images videos
          git commit -m "Add generated Fornello cover images and background videos" || exit 0
          git push
