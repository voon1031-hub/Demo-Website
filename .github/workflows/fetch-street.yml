# One-off helper: downloads the generated Tokyo street images on a GitHub
# runner (the cloud dev environment can't reach the media host), saves them
# as high-quality JPEGs and commits them back to this branch.
name: Fetch street images
on:
  push:
    branches: [claude/busy-clarke-a6dgtr]
    paths: ['.github/workflows/fetch-street.yml', 'minigt/tools/street-urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Download and convert
        run: |
          set -u
          mkdir -p minigt/assets/street/src .dl
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0" -o ".dl/$name.png" "$url"
            convert ".dl/$name.png" -strip -quality 92 "minigt/assets/street/src/$name.jpg"
            identify "minigt/assets/street/src/$name.jpg"
          done < minigt/tools/street-urls.txt
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minigt/assets/street/src
          git commit -m "Add generated Tokyo street images" || exit 0
          git push
