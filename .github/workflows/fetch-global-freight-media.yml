# Downloads Higgsfield-generated media for global-freight/ on a GitHub runner
# (the cloud dev environment can't reach the media host), prepares it with
# ffmpeg, and commits the results back to this branch.
name: Fetch global-freight media
on:
  push:
    branches: [claude/global-freight-site]
    paths:
      - global-freight/media/manifest.txt
      - global-freight/scripts/fetch-media.sh
      - .github/workflows/fetch-global-freight-media.yml
permissions:
  contents: write
concurrency:
  group: fetch-global-freight-media
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and prepare media
        run: bash global-freight/scripts/fetch-media.sh
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-freight
          git commit -m "Add generated media for global-freight" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
